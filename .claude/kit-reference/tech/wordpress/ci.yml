# CI for a WordPress project (web-agent-kit, reference/tech/wordpress.md §4).
# Copied to .github/workflows/ci.yml by new-project.ps1 -Stack wordpress. Adjust the PHP matrix:
# the oldest PHP a host may run (the plugin's "Requires PHP") and the newest the host offers.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: php -l
        run: bash scripts/php-lint.sh

  # The compiled CSS is committed (the host has no build step): it must match its source.
  # Skipped when the project has no build:css script.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compiled CSS up to date
        run: |
          if ! grep -q '"build:css"' package.json; then echo "no build:css: skipped"; exit 0; fi
          bun run build:css
          git diff --exit-code -- '*.css' || { echo "::error::the compiled CSS differs from its source: run bun run build:css and commit it"; exit 1; }

  # Optional: e2e against wp-env (sites without premium plugins only; wp-env cannot install them).
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: oven-sh/setup-bun@v2
  #     - run: bun install --frozen-lockfile
  #     - run: bunx @wordpress/env start
  #     - run: bunx playwright install --with-deps chromium
  #     - run: bunx playwright test
