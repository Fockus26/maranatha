# Local copy of a WordPress site from its backup (web-agent-kit, reference/tech/wordpress.md §2).
# For sites with premium plugins or that need their real data; wp-env for the rest.
#
#   docker compose --env-file .env.local up -d          (bun run local:up)
#   docker compose --env-file .env.local run --rm wpcli wp <command>   (bun run local:wp -- <command>)
#   docker compose --env-file .env.local --profile tools up -d phpmyadmin
#
# The backup's wp-content (.site-pull/files/wp-content, from scripts/pull-site.sh) is mounted,
# and the repo's plugin on top of its copy: an edit in the repo is live, the backup's old copy
# of the plugin is never used.
name: ${COMPOSE_PROJECT_NAME:-wp-site}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_HOME', '${LOCAL_URL:-http://localhost:8080}' );
    define( 'WP_SITEURL', '${LOCAL_URL:-http://localhost:8080}' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

x-wp-volumes: &wp-volumes
  - wp-core:/var/www/html
  - ./.site-pull/files/wp-content:/var/www/html/wp-content
  - ./wp-content/plugins/${SITE_PLUGIN:?set SITE_PLUGIN in .env.local}:/var/www/html/wp-content/plugins/${SITE_PLUGIN}
  # Child theme, if the project has one:
  # - ./wp-content/themes/${CHILD_THEME}:/var/www/html/wp-content/themes/${CHILD_THEME}
  - ./local/mu-plugins/kit-mailpit.php:/var/www/html/wp-content/mu-plugins/kit-mailpit.php:ro

services:
  db:
    image: mariadb:${MARIADB_VERSION:-10.11}
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The first start initializes the data files: more than 100 s on a slow disk, and
      # without this the copy failed with "db is unhealthy" (kit test, 2026-11-07).
      start_period: 5m

  wordpress:
    # Core and PHP pinned to production's: e.g. WP_IMAGE_TAG=6.8.3-php8.2-apache
    image: wordpress:${WP_IMAGE_TAG:-php8.2-apache}
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${LOCAL_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes

  wpcli:
    image: wordpress:${WPCLI_IMAGE_TAG:-cli-php8.2}
    profiles: [cli]
    user: "33:33"   # www-data, like the web container: files it writes stay writable by WordPress
    depends_on:
      db: { condition: service_healthy }
    environment: *wp-env
    volumes:
      - wp-core:/var/www/html
      - ./.site-pull/files/wp-content:/var/www/html/wp-content
      - ./wp-content/plugins/${SITE_PLUGIN}:/var/www/html/wp-content/plugins/${SITE_PLUGIN}
      # - ./wp-content/themes/${CHILD_THEME}:/var/www/html/wp-content/themes/${CHILD_THEME}
      - ./local/mu-plugins/kit-mailpit.php:/var/www/html/wp-content/mu-plugins/kit-mailpit.php:ro
      - ./local/mysql-client.cnf:/etc/my.cnf.d/kit-local.cnf:ro

  # Every email the copy sends lands here (http://localhost:8025), never at a real customer.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.27}
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION:-5.2}
    profiles: [tools]
    depends_on: [db]
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

volumes:
  db:
  wp-core:
